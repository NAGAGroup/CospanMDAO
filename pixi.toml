[workspace]
authors   = ["Jack Myers <jack@myersjack.dev>"]
name      = "cospanmdao"
version   = "0.1.0"
channels  = ["https://prefix.dev/jackm97/naga-labs-staging"]
platforms = [
  { platform = "linux-64", archspec = "x86_64_v3", name = "linux-64-v3" },
  "linux-aarch64",
  { platform = "osx-arm64", macos = "26.0", name = "osx-arm64-macos26" },
  { platform = "win-64", archspec = "x86_64_v3", name = "win-64-v3" },
  "win-arm64",
]
preview   = ["pixi-build"]

# One pool of specs; every table inherits with { workspace = true }.
[workspace.dependencies]
cospanmdao             = { path = "." }
cospanmdao-tests       = { path = "tests" }
cospanmdao-examples    = { path = "examples" }
slabkit                = { git = "https://github.com/NAGAGroup/SlabKit.git", rev = "c47d4b4fc2d838a92813f6d3e1b4ea35b58fcd49" }
cereal                 = ">=1.3"
catch2                 = ">=3.8"
naga-acpp-runtime-cuda = "*"
naga-acpp-runtime-ocl  = "*"
intel-opencl-rt        = "*"
naga-acpp-tools        = "==2026.10.19"
nushell                = ">=0.116.1,<0.117"

# Compiler stems resolve to <stem>_<platform> activation packages; their
# run-exports bring the toolchain. The backend supplies cmake/ninja.
[workspace.build-variants]
c_compiler           = ["naga-acpp-clang"]
cxx_compiler         = ["naga-acpp-clangxx"]
c_compiler_version   = ["2026.10.19"]
cxx_compiler_version = ["2026.10.19"]
naga-acpp-llvm       = ["23"]
cmake                = ["4.4.*"]

# ---- default environment: the built library and its tests ------------------
[dependencies]
cospanmdao       = { workspace = true }
cospanmdao-tests = { workspace = true }
cospanmdao-examples = { workspace = true }

[tasks]
test = "cospan-tests"
gemver-chain = "gemver-chain"
ns-residual = "ns-residual"
# The fusion benchmarks on CUDA (JIT warm-up, 5 timed runs, medians): examples/run_benchmarks.nu. Needs `nu` on PATH
# (and the cublas environment built for the cuBLAS reference: pixi run -e cublas build-cublas).
benchmarks = "nu examples/run_benchmarks.nu"

# ---- backend runtimes, opt-in, gated per platform --------------------------
# OpenMP, and Metal on macOS, come built in: they need no package.
# CUDA is published for linux-64 and win-64 (what CI tests).
[feature.cuda.target.linux-64.dependencies]
naga-acpp-runtime-cuda = { workspace = true }

[feature.cuda.target.win-64.dependencies]
naga-acpp-runtime-cuda = { workspace = true }

[environments.cuda]
features = ["cuda"]
solve-group = "default"

# OpenCL on Intel's CPU runtime (conda-forge intel-opencl-rt, proprietary Intel EULA; test environments only), linux-64 only.
# conda-forge is added to this feature alone.
[feature.ocl]
channels = ["conda-forge"]

[feature.ocl.target.linux-64.dependencies]
naga-acpp-runtime-ocl = { workspace = true }
intel-opencl-rt       = { workspace = true }

[environments.ocl]
features = ["ocl"]

# ---- the library package ----------------------------------------------------
[package]
name    = "cospanmdao"
version = "0.1.0"
license = "Apache-2.0"

[package.build.backend]
name     = "pixi-build-cmake"
version  = "*"
channels = ["https://prefix.dev/pixi-build-backends"]

[package.build.config]
# Headers are installed, not compiled; without this, editing one does not
# invalidate pixi's build cache.
extra-input-globs = ["include/**/*.hpp"]

[package.host-dependencies]
slabkit = { workspace = true }
cereal  = { workspace = true }

# Library with PUBLIC header deps: consumers compile against slabkit and cereal too.
[package.run-dependencies]
slabkit = { workspace = true }
cereal  = { workspace = true }

# A consumer that has cospanmdao only as a host dependency gets SlabKit's shared library at run time.
[package.run-exports.weak]
slabkit = { workspace = true }

# ---- dev environment: full build closure of both packages, neither built -----
[feature.dev.dev]
cospanmdao       = { path = "." }
cospanmdao-tests = { path = "tests" }

[feature.dev.dependencies]
nushell         = { workspace = true }
naga-acpp-tools = { workspace = true }
naga-acpp-lldb  = "==2026.10.19"  # our toolchain's debugger

[environments.dev]
features = ["dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-cuda]
features = ["dev", "cuda"]
solve-group = "default"
no-default-feature = true

[feature.git.dependencies]
git = "*"
[feature.git.tasks]
setup-git = "git config core.hooksPath .project/hooks"

[environments.git]
features = ["git"]
no-default-feature = true

# ---- documentation: Sphinx + Breathe over Doxygen XML ------------------------
[feature.documentation]
# doxygen has no win-arm64 build; feature platforms use the workspace entry names (see platforms above).
platforms = ["linux-64-v3", "linux-aarch64", "osx-arm64-macos26", "win-64-v3"]

[feature.documentation.dependencies]
sphinx          = "<9"  # breathe (latest 5.1) needs sphinx < 9; unpinned, the solver picked sphinx 9 with breathe 4.15, which fails to import
myst-parser     = "*"
furo            = "*"
breathe         = "*"
doxygen         = "*"
sphinx-autobuild = "*"

[feature.documentation.tasks]
# doxygen creates only the last directory of OUTPUT_DIRECTORY, so build/docs is made first.
docs-doxygen = "mkdir -p build/docs && doxygen docs/Doxyfile"
docs-build   = { cmd = "sphinx-build -b html docs/site build/docs/html", depends-on = ["docs-doxygen"] }
docs-serve   = { cmd = "sphinx-autobuild docs/site build/docs/html --host 0.0.0.0 --port 8000 --watch include/naga/cospan --pre-build 'doxygen docs/Doxyfile'", depends-on = ["docs-doxygen"] }

[environments.docs]
features = ["documentation"]
no-default-feature = true

# ---- cuBLAS reference for examples/gemver-chain -----------------------------
# A plain CUDA toolchain from conda-forge, apart from the AdaptiveCpp stack (its
# own solve group). cuda-version is pinned to what the driver supports (nvidia-smi:
# CUDA 13.3); gxx 14 is inside nvcc 13.x host-compiler support. Release builds only.
[feature.cublas]
channels = ["conda-forge"]
platforms = ["linux-64-v3"]  # the workspace entry named linux-64-v3 (feature platforms use entry names; target tables use the subdir)

[feature.cublas.dependencies]
cuda-nvcc       = "13.3.*"
cuda-cudart-dev = "13.3.*"
libcublas-dev   = "*"
cuda-version    = "13.3.*"
gxx             = "14.*"
cmake           = "*"
ninja           = "*"

[feature.cublas.tasks]
build-cublas          = "cmake -S examples/gemver-chain/cublas -B build/cublas -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=89 && cmake --build build/cublas"
gemver-chain-cublas   = "build/cublas/gemver-chain-cublas"

[environments.cublas]
features = ["cublas"]
no-default-feature = true
solve-group = "cublas"
