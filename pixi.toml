[workspace]
authors = ["Jack Myers <jack@myersjack.dev>"]
channels = ["https://prefix.dev/code-accelerate", "conda-forge"]
name = "cospanmdao"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[activation]
scripts = ["env.sh"]

[system-requirements]
libc = { family = "glibc", version = "2.28" }

[tasks]
configure = "nu scripts/configure.nu"
build = "nu scripts/build.nu"
test = "ACPP_VISIBILITY_MASK=omp ctest --test-dir build/dev --output-on-failure"
clean = "rm -rf build/"
sellar = "./build/dev/examples/sellar"

[dependencies]
# Source dependencies — built by pixi-build and installed into the env.
slabkit = { git = "https://github.com/NAGAGroup/SlabKit.git", rev = "024d01e0ae9f3209e6ea7931c33d5d028a1b23d1" }
cereal = { path = "packages/cereal" }

[feature.base.dependencies]
acpp-toolchain = ">=20.1.8_acpp25.10.0,<21"
cmake = ">=3.28,<4"
nushell = ">=0.110.0,<0.111"
ninja = ">=1.12"
catch2 = ">=3.8"

[feature.level-zero.dependencies]
level-zero = ">=1.28.2,<2"

[feature.cuda.dependencies]
cuda-nvvm = ">=12.9.86,<13"
cuda-runtime = ">=12.9.2,<13"
cuda-nvcc-tools = ">=12.9.86,<13"
cuda-sanitizer-api = ">=12.9.79,<13"

[feature.amd.dependencies]
hip-runtime-amd = ">=6,<7"
rocm-device-libs = ">=6,<7"

[environments.default]
features = ["base", "cuda"]
solve-group = "default"

# ------------------------------------------------------------------------------
# pixi-build package definition: CospanMDAO as a source package, so consumers
# (Mycelium, the LBM project, anyone) can depend on
#   cospanmdao = { git = "https://github.com/NAGAGroup/CospanMDAO.git", ... }
# and get the framework + its transitive source deps built automatically.
# ------------------------------------------------------------------------------
[package]
name = "cospanmdao"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-cmake"
version = "0.*"
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/code-accelerate",
  "https://prefix.dev/conda-forge",
]

[package.build.config]
# We bring our own SYCL compiler (AdaptiveCpp) instead of the backend's
# conda-forge default toolchain.
compilers = []
extra-args = [
  "-DNAGA_BUILD_TESTS=OFF",
  "-DNAGA_BUILD_EXAMPLES=OFF",
]

[package.build-dependencies]
acpp-toolchain = ">=20.1.8_acpp25.10.0,<21"

[package.host-dependencies]
acpp-toolchain = ">=20.1.8_acpp25.10.0,<21"
slabkit = { git = "https://github.com/NAGAGroup/SlabKit.git", rev = "024d01e0ae9f3209e6ea7931c33d5d028a1b23d1" }
cereal = { path = "packages/cereal" }

# Static lib with PUBLIC header/CMake-config deps: consumers need these at
# their own compile time, so they propagate as run-dependencies
# (manual run-exports).
[package.run-dependencies]
slabkit = { git = "https://github.com/NAGAGroup/SlabKit.git", rev = "024d01e0ae9f3209e6ea7931c33d5d028a1b23d1" }
cereal = { path = "packages/cereal" }

# ------------------------------------------------------------------------------
# Dev environment (fleet convention): dependency closure of the package
# installs WITHOUT building it — project-scoped agents run unstructured
# commands via `pixi run -e dev ...` and inspect dependency headers at
# .pixi/envs/dev/include/.
# ------------------------------------------------------------------------------
[feature.dev.dev]
cospanmdao = { path = "." }

[environments.dev]
features = ["base", "cuda", "dev"]
solve-group = "default"
