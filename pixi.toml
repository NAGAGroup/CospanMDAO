[workspace]
authors   = ["Jack Myers <jack@myersjack.dev>"]
name      = "cospanmdao"
version   = "0.1.0"
channels  = ["https://prefix.dev/jackm97/naga-labs-staging"]
platforms = ["linux-64"]
preview   = ["pixi-build"]

# One pool of specs; every table inherits with { workspace = true }.
[workspace.dependencies]
cospanmdao             = { path = "." }
cospanmdao-tests       = { path = "tests" }
cospanmdao-examples    = { path = "examples" }
slabkit                = { git = "https://github.com/NAGAGroup/SlabKit.git", rev = "4f570864349a598f598da7487aa892ffda67f66a" }
cereal                 = ">=1.3"
catch2                 = ">=3.8"
naga-acpp-runtime-cuda = "*"
naga-acpp-tools        = "==2026.10.06"
nushell                = ">=0.110.0,<0.111"

# Compiler stems resolve to <stem>_<platform> activation packages; their
# run-exports bring the toolchain. The backend supplies cmake/ninja.
[workspace.build-variants]
c_compiler           = ["naga-acpp-clang"]
cxx_compiler         = ["naga-acpp-clangxx"]
c_compiler_version   = ["2026.10.06"]
cxx_compiler_version = ["2026.10.06"]
naga-acpp-llvm       = ["21"]
cmake                = ["3.31.*"]

# ---- default environment: the built library and its tests ------------------
[dependencies]
cospanmdao       = { workspace = true }
cospanmdao-tests = { workspace = true }
cospanmdao-examples = { workspace = true }

[tasks]
test = "cospan-tests"
gemver-chain = "gemver-chain"
ns-residual = "ns-residual"
# The fusion benchmarks on CUDA (JIT warm-up, 5 timed runs, medians): examples/run_benchmarks.nu. Needs `nu` on PATH
# (and the cublas environment built for the cuBLAS reference: pixi run -e cublas build-cublas).
benchmarks = "nu examples/run_benchmarks.nu"

# ---- CUDA runtime, opt-in ---------------------------------------------------
[feature.cuda.dependencies]
naga-acpp-runtime-cuda = { workspace = true }

[environments.cuda]
features = ["cuda"]
solve-group = "default"

# ---- the library package ----------------------------------------------------
[package]
name    = "cospanmdao"
version = "0.1.0"

[package.build.backend]
name     = "pixi-build-cmake"
version  = "*"
channels = ["https://prefix.dev/pixi-build-backends"]

[package.build.config]
# Headers are installed, not compiled; without this, editing one does not
# invalidate pixi's build cache.
extra-input-globs = ["include/**/*.hpp"]

[package.host-dependencies]
slabkit = { workspace = true }
cereal  = { workspace = true }

# Library with PUBLIC header deps: consumers compile against slabkit and cereal too.
[package.run-dependencies]
slabkit = { workspace = true }
cereal  = { workspace = true }

# ---- dev environment: full build closure of both packages, neither built -----
[feature.dev.dev]
cospanmdao       = { path = "." }
cospanmdao-tests = { path = "tests" }

[feature.dev.dependencies]
nushell         = { workspace = true }
naga-acpp-tools = { workspace = true }

[environments.dev]
features = ["dev"]
solve-group = "default"
no-default-feature = true

[environments.dev-cuda]
features = ["dev", "cuda"]
solve-group = "default"
no-default-feature = true

[feature.git.dependencies]
git = "*"
[feature.git.tasks]
setup-git = "git config core.hooksPath .project/hooks"

[environments.git]
features = ["git"]
no-default-feature = true

# ---- cuBLAS reference for examples/gemver-chain -----------------------------
# A plain CUDA toolchain from conda-forge, apart from the AdaptiveCpp stack (its
# own solve group). cuda-version is pinned to what the driver supports (nvidia-smi:
# CUDA 13.3); gxx 14 is inside nvcc 13.x host-compiler support. Release builds only.
[feature.cublas]
channels = ["conda-forge"]

[feature.cublas.dependencies]
cuda-nvcc       = "13.3.*"
cuda-cudart-dev = "13.3.*"
libcublas-dev   = "*"
cuda-version    = "13.3.*"
gxx             = "14.*"
cmake           = "*"
ninja           = "*"

[feature.cublas.tasks]
build-cublas          = "cmake -S examples/gemver-chain/cublas -B build/cublas -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=89 && cmake --build build/cublas"
gemver-chain-cublas   = "build/cublas/gemver-chain-cublas"

[environments.cublas]
features = ["cublas"]
no-default-feature = true
solve-group = "cublas"
