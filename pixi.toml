[workspace]
authors = ["Jack Myers <jack@myersjack.dev>"]
channels = ["https://prefix.dev/code-accelerate", "conda-forge"]
name = "cospanmdao"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[activation]
scripts = ["env.sh"]

[system-requirements]
libc = { family = "glibc", version = "2.28" }

# ------------------------------------------------------------------------------
# CONSUMER environment (default): consumes the developed package itself.
# `pixi install` builds cospanmdao + its chain into the env; pixi-pack packs
# this env directly (`pixi exec pixi-pack --create-executable`).
# Toolchains/compilers NEVER appear here — they come from the package's own
# dependency tables via the dev environment below.
# ------------------------------------------------------------------------------
[dependencies]
cospanmdao = { path = "." }

[feature.cuda.dependencies]
cuda-nvvm = ">=12.9.86,<13"
cuda-runtime = ">=12.9.2,<13"
cuda-nvcc-tools = ">=12.9.86,<13"
cuda-sanitizer-api = ">=12.9.79,<13"

[feature.level-zero.dependencies]
level-zero = ">=1.28.2,<2"

[feature.amd.dependencies]
hip-runtime-amd = ">=6,<7"
rocm-device-libs = ">=6,<7"

[environments.default]
features = ["cuda"]
solve-group = "default"

# ------------------------------------------------------------------------------
# The package: what consumers get when they declare
#   cospanmdao = { git = "https://github.com/NAGAGroup/CospanMDAO.git", ... }
# ------------------------------------------------------------------------------
[package]
name = "cospanmdao"
version = "0.1.0"

[package.build.backend]
name = "pixi-build-cmake"
version = "0.*"
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/code-accelerate",
  "https://prefix.dev/conda-forge",
]

[package.build.config]
# We bring our own SYCL compiler (AdaptiveCpp) instead of the backend's
# conda-forge default toolchain.
compilers = []
extra-args = [
  "-DNAGA_BUILD_TESTS=OFF",
  "-DNAGA_BUILD_EXAMPLES=OFF",
]

[package.build-dependencies]
acpp-toolchain = ">=20.1.8_acpp25.10.0,<21"
cmake = ">=3.28,<4"
ninja = ">=1.12"

[package.host-dependencies]
acpp-toolchain = ">=20.1.8_acpp25.10.0,<21"
slabkit = { git = "https://github.com/NAGAGroup/SlabKit.git", rev = "3d4d04ac8f21b9b822935f9f75d3014c721c3b9c" }
cereal = { path = "packages/cereal" }

# Static lib with PUBLIC header/CMake-config deps: consumers need these at
# their own compile time, so they propagate as run-dependencies
# (manual run-exports).
[package.run-dependencies]
slabkit = { git = "https://github.com/NAGAGroup/SlabKit.git", rev = "3d4d04ac8f21b9b822935f9f75d3014c721c3b9c" }
cereal = { path = "packages/cereal" }

# ------------------------------------------------------------------------------
# DEV environment: the package's dependency closure (toolchain included)
# WITHOUT building the package, plus dev-only tools and tasks. Unstructured
# work runs inside the build-time env: `pixi run -e dev <anything>`.
# ------------------------------------------------------------------------------
[feature.dev.dev]
cospanmdao = { path = "." }

[feature.dev.dependencies]
nushell = ">=0.110.0,<0.111"
catch2 = ">=3.8"

[feature.dev.tasks]
configure = "nu scripts/configure.nu dev"
build = { cmd = "nu scripts/build.nu dev", depends-on = ["configure"] }
test = { cmd = "ACPP_VISIBILITY_MASK=omp ctest --test-dir build/dev --output-on-failure", depends-on = ["build"] }
sellar = { cmd = "./build/dev/examples/sellar", depends-on = ["build"] }

# Hardware-flavored dev envs: `-e dev` is the daily (CUDA) default;
# dev-l0 / dev-amd / dev-cuda select the backend explicitly.
[environments.dev]
features = ["cuda", "dev"]
solve-group = "default"

[environments.dev-cuda]
features = ["cuda", "dev"]
solve-group = "default"

[environments.dev-l0]
features = ["level-zero", "dev"]
solve-group = "default"

[environments.dev-amd]
features = ["amd", "dev"]
solve-group = "default"

# CPU-only: no GPU backend feature — AdaptiveCpp's built-in OpenMP host
# backend needs nothing beyond the toolchain itself.
[environments.dev-omp]
features = ["dev"]
solve-group = "default"
