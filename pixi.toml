[workspace]
authors = ["Jack Myers <jack@myersjack.dev>"]
channels = ["https://prefix.dev/conda-forge"]
name = "cospanmdao"
platforms = ["linux-64"]
version = "0.1.0"

# TEMPORARY (2026-09-28). Every toolchain-bound section was removed so the
# workspace solves while the naga AdaptiveCpp toolchain is republished:
# the acpp pins, the slabkit/cereal path dependencies, the pixi-build
# [package] tables, the build-variants, the env.sh activation, the
# per-backend (cuda/l0/amd) features and the dev-* environments. Both this
# manifest and slabkit's get redone against the new toolchain. The full
# previous manifest is `git show dbebc3a:pixi.toml`.

[dependencies]
nushell = ">=0.110.0,<0.111"
cmake = ">=3.28,<4"
ninja = ">=1.12"
catch2 = ">=3.8"

[tasks]
setup-git = "git config core.hooksPath .project/hooks"
