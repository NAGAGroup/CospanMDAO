# Wrapper package: upstream cereal consumed as a pixi-build source package.
# The manifest lives here (we control it); the SOURCE is upstream git.
[package]
name = "cereal"
version = "1.3.2"

[package.build.backend]
name = "pixi-build-cmake"
version = "0.*"
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]

[package.build.source]
git = "https://github.com/USCiLab/cereal.git"
tag = "v1.3.2"

[package.build.config]
extra-args = [
  "-DJUST_INSTALL_CEREAL=ON",
  "-DSKIP_PERFORMANCE_COMPARISON=ON",
  "-DBUILD_TESTS=OFF",
  "-DBUILD_SANDBOX=OFF",
  "-DBUILD_DOC=OFF",
]
# Header-only: keep the cache honest on header edits (upstream is pinned by
# tag so this is belt-and-suspenders).
extra-input-globs = ["include/**/*.hpp", "include/**/*.h"]
