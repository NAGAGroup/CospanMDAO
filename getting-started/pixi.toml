[workspace]
name      = "getting-started"
version   = "0.1.0"
channels  = ["https://prefix.dev/jackm97/naga-labs-staging"]
platforms = [
  { platform = "linux-64", archspec = "x86_64_v3" },
  "linux-aarch64",
  { platform = "osx-arm64", macos = "26.0" },
  { platform = "win-64", archspec = "x86_64_v3" },
  "win-arm64",
]
preview   = ["pixi-build"]

[workspace.build-variants]
c_compiler           = ["naga-acpp-clang"]
cxx_compiler         = ["naga-acpp-clangxx"]
c_compiler_version   = ["2026.10.20"]
cxx_compiler_version = ["2026.10.20"]
naga-acpp-llvm       = ["23"]
cmake                = ["4.4.*"]

[package]
name    = "getting-started"
version = "0.1.0"

[package.build.backend]
name     = "pixi-build-cmake"
version  = "*"
channels = ["https://prefix.dev/pixi-build-backends"]

[package.host-dependencies]
cospanmdao = { git = "https://github.com/NAGAGroup/CospanMDAO.git" }

[dependencies]
getting-started = { path = "." }

[tasks]
getting-started = "getting-started"
